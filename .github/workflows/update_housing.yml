name: Update Tennessee housing data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 12 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and filter Redfin data
        run: python filter_redfin.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tennessee_county_housing.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Tennessee housing data"
            git push
          fi

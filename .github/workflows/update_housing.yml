name: Update Tennessee housing data

on:
  workflow_dispatch:
  schedule:
    # Check daily during Redfin's likely monthly release window.
    # 12:30 UTC is approximately 7:30 AM Central during daylight time.
    - cron: "30 12 8-16 * *"

permissions:
  contents: write

concurrency:
  group: tennessee-housing-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Create this Actions repository variable with the direct CSV URL
      # generated by Redfin's new Data Center Download Hub.
      # The Python script will use the legacy S3 URL only when this is blank,
      # but it will fail rather than commit stale data.
      REDFIN_SOURCE_URL: ${{ vars.REDFIN_SOURCE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, validate, and filter Redfin data
        run: python filter_redfin.py

      - name: Show latest output month
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/tennessee_county_housing.csv")
          with path.open(encoding="utf-8-sig", newline="") as stream:
              rows = list(csv.DictReader(stream))

          latest = max(row["Reporting Month"] for row in rows)
          latest_rows = [r for r in rows if r["Reporting Month"] == latest]

          print(f"Latest month: {latest}")
          print(f"Latest month county count: {len(latest_rows)}")

          if len(latest_rows) != 10:
              raise SystemExit("Latest month does not contain all 10 counties.")
          PY

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tennessee_county_housing.csv

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            latest_month=$(tail -n +2 data/tennessee_county_housing.csv \
              | cut -d, -f1 | sort | tail -1)
            git commit -m "Update Tennessee housing data through ${latest_month}"
            git push
          fi
